<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Romola工作台">
<meta name="theme-color" content="#E52211">
<title>🎀 Romola工作台 v2.0</title>
<style>
/* ============ 全局变量（按用户要求重新配色） ============ */
:root{
  --red:#E52211;          /* 主色：正红 */
  --yellow:#FEE202;       /* 强调：亮黄 */
  --blue:#0085D0;         /* 信息：天蓝 */
  --dark:#010002;         /* 文字/深色 */
  --bg:#FFF0F2;           /* 加深的淡粉色背景 */
  --bg-deep:#FFE4E8;      /* 更深的淡粉 */
  --card:#FFFFFF;
  --light-blue:#E1F2FB;
  --light-red:#FFE6EB;
  --light-yellow:#FFFACB;
  --text:#010002;
  --text-sec:#6B5C5F;
  --radius-card:18px;
  --radius-btn:24px;
  --radius-input:12px;
  --shadow:0 4px 16px rgba(229,34,17,.10);
  --shadow-blue:0 4px 16px rgba(0,133,208,.12);
  --shadow-yellow:0 4px 16px rgba(254,226,2,.35);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;          /* 整体调大：不再太小 */
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
input,textarea,button,select{font-family:inherit;font-size:inherit;border:none;outline:none;background:none;color:var(--text);}
input:focus,textarea:focus,select:focus{border-color:var(--red)!important;box-shadow:0 0 0 3px rgba(229,34,17,.15);}
button{cursor:pointer;color:inherit;}
ul{list-style:none;}
h1,h2,h3,h4{font-weight:700;}

/* 通用更大字号（iPad 友好） */
.section-title{font-size:15px;font-weight:700;color:var(--red);margin:18px 0 10px;display:flex;align-items:center;gap:6px;}
.section-title .st-icon{font-size:17px;}
.card{background:var(--card);border-radius:var(--radius-card);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.input-group{margin-bottom:14px;}
.input-group label{display:block;font-size:13px;color:var(--text-sec);margin-bottom:6px;font-weight:600;}
.input-group input,.input-group textarea,.input-group select{
  width:100%;border:1.5px solid #e8d5d8;border-radius:var(--radius-input);
  padding:12px 14px;font-size:15px;background:#fff;
}
.input-group textarea{min-height:80px;resize:vertical;}
.input-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.input-row input{flex:1;min-width:80px;}

/* 蝴蝶结水印 */
.bow-watermark{position:fixed;width:90px;height:60px;opacity:.08;pointer-events:none;z-index:0;}
.bow-watermark svg{width:100%;height:100%;}
.bow-tl{top:80px;left:8px;}
.bow-tr{top:80px;right:8px;}
.bow-bl{bottom:20px;left:8px;}
.bow-br{bottom:20px;right:8px;}

/* App 布局 */
#app{display:flex;height:100%;position:relative;z-index:1;}

/* 左侧导航 */
.sidebar{
  width:96px;flex-shrink:0;height:100%;
  background:linear-gradient(180deg,#fff 0%,var(--bg-deep) 100%);
  border-right:1px solid #f1d1d6;
  display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;position:relative;
  padding-bottom:20px;
}
.sidebar::-webkit-scrollbar{width:0;}
.sidebar-logo{
  text-align:center;padding:16px 0 12px;color:#fff;
  background:var(--red);position:sticky;top:0;z-index:2;
  background-image:radial-gradient(circle, rgba(254,226,2,.5) 1px, transparent 1px);
  background-size:10px 10px;background-color:var(--red);
}
.sidebar-logo span{position:relative;z-index:1;display:block;line-height:1.2;font-size:24px;}
.sidebar-logo small{font-size:11px;display:block;opacity:.95;letter-spacing:1px;}
.nav-item{
  display:flex;flex-direction:column;align-items:center;
  padding:12px 4px;margin:4px 6px;border-radius:14px;
  color:var(--text-sec);font-size:12px;text-align:center;
  position:relative;transition:all .2s;gap:5px;
}
.nav-item .nav-icon{font-size:22px;line-height:1;}
.nav-item.active{background:var(--light-yellow);color:var(--red);font-weight:700;}
.nav-item.active::before{
  content:'';position:absolute;left:-6px;top:50%;transform:translateY(-50%);
  width:4px;height:26px;background:var(--red);border-radius:0 4px 4px 0;
}
.nav-item:active{transform:scale(.92);}

/* 主内容 */
.main{
  flex:1;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  position:relative;background:var(--bg);
}
.main::-webkit-scrollbar{width:0;}
.page{display:none;padding:16px 14px 90px;animation:fadeIn .3s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* 首页 */
.home-top-bar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.home-time{font-size:40px;font-weight:900;color:var(--blue);line-height:1;letter-spacing:-1px;}
.home-date{font-size:13px;color:var(--text-sec);margin-top:5px;font-weight:600;}
.home-bow-btn{
  font-size:28px;padding:8px 12px;border-radius:50%;
  background:#fff;box-shadow:var(--shadow);transition:transform .1s;
}
.home-bow-btn:active{transform:scale(.9);}

/* 进度环 */
.progress-ring-wrap{display:flex;justify-content:center;margin:20px 0 12px;position:relative;}
.progress-ring{position:relative;width:210px;height:210px;}
.progress-ring svg{transform:rotate(-90deg);}
.progress-ring-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;width:150px;
}
.progress-time{font-size:32px;font-weight:900;color:var(--red);line-height:1.1;}
.progress-label{font-size:12px;color:var(--text-sec);margin-top:5px;font-weight:600;}
.progress-pct{font-size:13px;font-weight:800;color:var(--blue);margin-top:6px;}

.add-duration-btn{
  display:block;margin:0 auto 18px;
  background:var(--red);color:#fff;
  padding:15px 38px;border-radius:999px;
  font-size:15px;font-weight:700;box-shadow:var(--shadow);
  transition:transform .1s;
  white-space:nowrap;
  max-width:90%;
}
.add-duration-btn:active{transform:scale(.95);}

/* 名言 */
.quote-card{
  background:var(--card);border-left:4px solid var(--yellow);
  border-radius:0 16px 16px 0;padding:16px 18px;margin:16px 0;
  box-shadow:var(--shadow);
}
.quote-zh{font-size:16px;font-weight:700;color:var(--text);line-height:1.7;}
.quote-en{font-size:12px;font-style:italic;color:var(--blue);margin-top:6px;line-height:1.5;}

/* 打卡栏 */
.checkin-row{display:flex;gap:10px;margin:14px 0;}
.checkin-cell{
  flex:1;background:var(--card);border-radius:14px;padding:10px 6px;
  text-align:center;box-shadow:var(--shadow);font-size:11px;
}
.checkin-cell .ci-icon{font-size:22px;display:block;margin-bottom:3px;}
.checkin-cell .ci-label{color:var(--text-sec);font-size:11px;}
.checkin-cell .ci-status{margin-top:4px;font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;display:inline-block;}
.ci-status.done{background:var(--light-yellow);color:var(--red);}
.ci-status.todo{background:var(--bg-deep);color:var(--text-sec);}

/* 快捷入口 */
.quick-entry-row{display:flex;gap:10px;margin-top:14px;}
.quick-entry-btn{
  flex:1;background:var(--red);color:#fff;
  padding:16px 6px;border-radius:16px;text-align:center;
  font-size:13px;font-weight:700;box-shadow:var(--shadow);
  transition:transform .1s;
}
.quick-entry-btn:active{transform:scale(.95);}
.quick-entry-btn .qe-icon{font-size:22px;display:block;margin-bottom:4px;}

/* 浮层概览 */
.overlay-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;
  display:none;align-items:flex-start;justify-content:flex-end;
  padding:80px 110px 0 0;
}
.overlay-mask.show{display:flex;}
.today-overview{
  background:#fff;border-radius:16px;padding:18px;min-width:220px;
  box-shadow:0 8px 32px rgba(0,0,0,.18);animation:fadeIn .2s;
}
.today-overview h4{color:var(--red);margin-bottom:10px;font-size:14px;}
.today-overview-item{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0;}
.today-overview-item span:last-child{color:var(--blue);font-weight:700;display:flex;align-items:center;gap:4px;}
.del-dur-btn{cursor:pointer;font-size:13px;opacity:.5;transition:opacity .1s;}
.del-dur-btn:active{opacity:1;}

/* 模块头 */
.module-header{
  background:linear-gradient(135deg,var(--red) 0%,#ff4d6d 100%);
  border-radius:var(--radius-card);padding:18px;color:#fff;
  margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;
  box-shadow:var(--shadow);
}
.module-header .mh-title{font-size:19px;font-weight:800;}
.module-header .mh-title .mh-icon{margin-right:6px;}
.module-header .mh-time{font-size:14px;opacity:.95;background:rgba(255,255,255,.22);padding:5px 14px;border-radius:14px;font-weight:700;}

/* 统计卡片 */
.stat-cards{display:flex;gap:10px;margin-bottom:14px;}
.stat-card{
  flex:1;background:var(--card);border-radius:14px;padding:12px 6px;text-align:center;
  box-shadow:var(--shadow);
}
.stat-card .sc-label{font-size:11px;color:var(--text-sec);font-weight:600;}
.stat-card .sc-value{font-size:18px;font-weight:800;color:var(--red);margin-top:3px;}
.stat-card.clickable:active{transform:scale(.95);}

/* 任务项 */
.task-item{
  background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .15s;
}
.task-item.done{opacity:.7;background:var(--light-blue);}
.task-top{display:flex;align-items:flex-start;gap:10px;}
.task-checkbox{
  width:24px;height:24px;border-radius:50%;border:2px solid var(--red);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:13px;color:#fff;transition:all .2s;margin-top:1px;background:#fff;
}
.task-checkbox.checked{background:var(--red);}
.task-body{flex:1;min-width:0;}
.task-title{font-size:14px;font-weight:700;color:var(--text);word-break:break-word;}
.task-meta{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;}
.task-meta-item{font-size:12px;color:var(--text-sec);display:flex;align-items:center;gap:4px;font-weight:600;}
.task-meta-item input{
  width:54px;border:1px solid #eee;border-radius:6px;padding:3px 5px;text-align:center;
  font-size:12px;
}
.task-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.task-btn{
  padding:7px 14px;border-radius:10px;font-size:12px;font-weight:700;
  transition:transform .1s;
}
.task-btn:active{transform:scale(.92);}
.task-btn-done{background:var(--light-blue);color:var(--blue);}
.task-btn-edit{background:var(--light-yellow);color:#a88c00;}
.task-btn-del{background:var(--light-red);color:var(--red);}
.task-btn-end{background:var(--light-yellow);color:#a88c00;}

/* 子任务 */
.subtask-list{margin-top:10px;padding-left:8px;border-left:2px solid var(--light-red);}
.subtask-row{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12px;}
.subtask-row .sub-check{
  width:18px;height:18px;border-radius:50%;border:2px solid var(--blue);display:flex;
  align-items:center;justify-content:center;font-size:10px;color:#fff;flex-shrink:0;background:#fff;
}
.subtask-row .sub-check.checked{background:var(--blue);}
.subtask-row .sub-title{flex:1;}
.subtask-row .sub-del{cursor:pointer;color:var(--red);font-size:13px;}

.add-task-btn{
  width:100%;padding:14px;border:1.5px dashed var(--red);border-radius:14px;
  color:var(--red);font-size:14px;font-weight:700;background:transparent;
  transition:transform .1s;
}
.add-task-btn:active{transform:scale(.97);}

/* 总任务进度卡片 */
.big-progress-card{
  background:linear-gradient(135deg,#fff 0%,var(--light-yellow) 100%);
  border-radius:var(--radius-card);padding:16px;margin-bottom:14px;
  box-shadow:var(--shadow);
}
.big-progress-card .bpc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.big-progress-card .bpc-title{font-size:14px;font-weight:700;color:var(--red);}
.big-progress-card .bpc-val{font-size:13px;color:var(--blue);font-weight:700;}
.big-progress-card .bpc-bar{
  height:14px;background:#fff;border-radius:8px;overflow:hidden;border:1.5px solid var(--red);
}
.big-progress-card .bpc-fill{
  height:100%;background:linear-gradient(90deg,var(--yellow),var(--red));
  border-radius:8px;transition:width .6s;
}
.bpc-list{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.bpc-row{display:flex;align-items:center;gap:8px;font-size:12px;}
.bpc-row .bpc-name{flex:1;color:var(--text);font-weight:600;}
.bpc-row .bpc-track{flex:2;height:8px;background:#fff;border-radius:4px;overflow:hidden;}
.bpc-row .bpc-track>div{height:100%;background:var(--red);border-radius:4px;transition:width .5s;}
.bpc-row .bpc-num{font-size:11px;color:var(--blue);font-weight:700;min-width:54px;text-align:right;}

/* 折叠 */
.collapsible-header{
  display:flex;justify-content:space-between;align-items:center;
  color:var(--blue);font-size:14px;font-weight:700;padding:10px 0;cursor:pointer;
}
.collapsible-body{display:none;}
.collapsible-body.show{display:block;animation:fadeIn .2s;}

.checkbox-group{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}
.check-chip{
  padding:6px 14px;border:1px solid #eee;border-radius:20px;font-size:13px;
  transition:all .15s;cursor:pointer;
}
.check-chip.checked{background:var(--light-red);border-color:var(--red);color:var(--red);font-weight:700;}
.radio-chip{padding:6px 14px;border:1px solid #eee;border-radius:20px;font-size:13px;cursor:pointer;}
.radio-chip.selected{background:var(--light-blue);border-color:var(--blue);color:var(--blue);font-weight:700;}

.save-btn{
  background:var(--red);color:#fff;padding:13px;border-radius:var(--radius-btn);
  font-size:15px;font-weight:700;width:100%;margin-top:12px;
  box-shadow:var(--shadow);transition:transform .1s;
}
.save-btn:active{transform:scale(.95);}
.save-btn.blue{background:var(--blue);}
.save-btn.yellow{background:var(--yellow);color:var(--dark);}
.save-btn.ghost{background:transparent;color:var(--red);border:1.5px solid var(--red);}

.accuracy-display{
  font-size:14px;color:var(--red);font-weight:800;margin-top:6px;
  background:var(--light-yellow);padding:8px 12px;border-radius:10px;
}

/* 星级 */
.stars{display:flex;gap:6px;margin-top:4px;}
.star{font-size:24px;cursor:pointer;opacity:.35;transition:all .15s;}
.star.active{opacity:1;}

/* 空状态 */
.empty-state{text-align:center;padding:36px 20px;}
.empty-state .es-icon{font-size:48px;margin-bottom:10px;}
.empty-state .es-text{font-size:14px;color:var(--text-sec);}

/* 底部弹出 */
.bottom-sheet-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;
  display:none;align-items:flex-end;justify-content:center;
}
.bottom-sheet-mask.show{display:flex;}
.bottom-sheet{
  background:#fff;border-radius:24px 24px 0 0;padding:22px;width:100%;max-width:560px;
  max-height:85vh;overflow-y:auto;animation:slideUp .25s ease;
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.bottom-sheet h3{color:var(--red);margin-bottom:16px;font-size:17px;text-align:center;}
.bs-close{text-align:center;margin-top:14px;color:var(--text-sec);font-size:14px;}

/* Toast */
.toast-wrap{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:300;pointer-events:none;}
.toast{
  background:var(--red);color:#fff;padding:12px 26px;border-radius:0 0 22px 22px;
  font-size:14px;font-weight:700;box-shadow:var(--shadow);
  animation:toastIn .3s,toastOut .3s 1.7s forwards;
}
@keyframes toastIn{from{transform:translateY(-100%);}to{transform:translateY(0);}}
@keyframes toastOut{to{transform:translateY(-100%);}}

/* 模块选择 */
.module-picker{display:flex;flex-wrap:wrap;gap:10px;}
.module-pick-item{
  flex:1;min-width:90px;text-align:center;padding:14px 6px;border-radius:14px;
  background:var(--light-red);color:var(--red);font-size:13px;font-weight:700;
  transition:transform .1s;
}
.module-pick-item:active{transform:scale(.92);}
.module-pick-item .mpi-icon{font-size:24px;display:block;margin-bottom:4px;}

/* 图表 */
.chart-container{background:var(--card);border-radius:var(--radius-card);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.bar-chart{display:flex;align-items:flex-end;gap:5px;height:130px;margin-top:10px;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;}
.bar{width:64%;background:var(--red);border-radius:5px 5px 0 0;position:relative;min-height:2px;max-height:100%;transition:height .5s;}
.bar::after{content:'';position:absolute;top:-5px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:var(--blue);}
.bar-label{font-size:10px;color:var(--text-sec);margin-top:5px;font-weight:600;}

.hbar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.hbar-label{width:80px;font-size:12px;text-align:right;color:var(--text-sec);font-weight:600;}
.hbar-track{flex:1;height:20px;background:var(--light-blue);border-radius:10px;overflow:hidden;position:relative;}
.hbar-fill{height:100%;background:linear-gradient(90deg,var(--red),#ff4d6d);border-radius:10px;transition:width .5s;}
.hbar-val{font-size:12px;color:var(--red);font-weight:700;width:50px;}

.pie-chart-wrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.pie-legend{flex:1;min-width:160px;}
.pie-legend-item{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:4px;}
.pie-legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;}

/* 折线 */
.line-chart-wrap{position:relative;height:160px;}
.line-chart-wrap svg{width:100%;height:100%;}

/* 日历 */
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;}
.cal-day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-size:11px;border-radius:8px;position:relative;background:var(--bg-deep);
}
.cal-day.has-data{background:var(--light-red);}
.cal-day.has-data::after{
  content:'';position:absolute;bottom:3px;width:6px;height:6px;border-radius:50%;background:var(--red);
}
.cal-day.today{outline:2px solid var(--blue);font-weight:800;}
.cal-header{font-size:11px;color:var(--text-sec);text-align:center;padding:3px 0;font-weight:700;}

/* 心情 */
.mood-picker{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.mood-item{
  padding:8px;border-radius:14px;border:2px solid transparent;font-size:24px;
  transition:all .2s;cursor:pointer;text-align:center;
}
.mood-item span{display:block;font-size:10px;margin-top:2px;}
.mood-item.selected{border-color:var(--red);background:var(--light-red);transform:scale(1.15);box-shadow:0 0 12px rgba(229,34,17,.3);}

/* 进度条 */
.big-progress{margin:14px 0;}
.big-progress-bar{
  height:26px;background:var(--light-blue);border-radius:14px;overflow:hidden;
  border:2px solid var(--red);position:relative;
}
.big-progress-fill{height:100%;background:var(--blue);border-radius:11px;transition:width .5s;}
.star-grid{display:flex;gap:3px;margin-top:8px;}
.star-grid-item{flex:1;text-align:center;font-size:18px;opacity:.3;}
.star-grid-item.lit{opacity:1;}

/* ============ 方块进度（参考图片风格） ============ */
.prog-block-row{display:flex;align-items:center;gap:4px;margin:6px 0;flex-wrap:nowrap;}
.prog-block-label{font-size:11px;color:var(--text-sec);font-weight:600;flex-shrink:0;margin-right:2px;}
.prog-block{
  flex:1;height:18px;background:#e8e8ec;border-radius:2px;overflow:hidden;
  position:relative;min-width:14px;border:1px solid #d4d4da;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.06);
}
.prog-block-fill{

const MOODS = [
  {icon:'☀️',label:'超棒',score:5},
  {icon:'🌤',label:'不错',score:4},

];

  {key:'zuoti',icon:'✍️',label:'做题'},
  {key:'jilei',icon:'📖',label:'积累'}

// ============================================================
//  云端 API 配置（部署后自动获取）
// ============================================================
// 本地开发时设为空字符串 ''，部署后由页面自动获取
let API_BASE = '';
// 尝试自动检测 API 地址（从当前页面 URL 推导）
(function detectApiBase(){
  const loc = window.location;
  // 如果是通过 Railway / 公网域名访问，用同域 API
  if(loc.hostname !== 'localhost' && loc.hostname !== '127.0.0.1') {
    API_BASE = loc.origin;
  }
  // 如果是本地调试，保留空
})();

let DB = null;

function defaultDB(){
  const tasks = {};
  const records = {};
  MODULES.forEach(m=>{tasks[m.key]=[];records[m.key]=[];});
  return {
    version:"2.0",
    tasks:tasks,
    records:records,
    dailyDuration:{},
    weight:[],
    mokao:[],
    mokaoSubs:{},      // {date: {xingce:{常识:{total,correct}}, shenlun:{...}}}
    materials:[],
    moods:[],
    reviews:[],
    diet:[],
    examDate:null,
    quotes:{currentIndex:0,lastUpdate:''},
    settings:{theme:"romola",sound:true},
    manualDuration:{}
  };
}

function loadDB(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      DB = JSON.parse(raw);
      const def = defaultDB();
      for(const k in def){ if(DB[k]===undefined) DB[k]=def[k]; }
      MODULES.forEach(m=>{
        if(!DB.tasks[m.key]) DB.tasks[m.key]=[];
        if(!DB.records[m.key]) DB.records[m.key]=[];
      });
      if(!DB.diet) DB.diet=[];
      if(!DB.examDate) DB.examDate=null;
      if(!DB.mokaoSubs) DB.mokaoSubs={};
    }else{
      DB = defaultDB();
      saveDB();
    }
  }catch(e){
    console.error('加载数据失败',e);
    DB = defaultDB();
  }
}

function saveDB(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
    // 云端自动同步（异步推送，不阻塞保存）
    const syncId = localStorage.getItem(SYNC_KEY);
    if(syncId && API_BASE){
      cloudPushAsync(syncId, DB);
    }
  }catch(e){
    console.error('保存失败',e);
    showToast('⚠️ 存储空间不足');
  }
}

// 异步云端推送（不阻塞 UI）
let _lastPushTime = 0;
let _isPulling = false; // 正在从云端拉取时为 true，防止 pull→save→push 循环
async function cloudPushAsync(deviceId, data){
  // 拉取过程中不回推，避免循环
  if(_isPulling) return;
  // 节流：5 秒内不重复推送
  const now = Date.now();
  if(now - _lastPushTime < 5000) return;
  _lastPushTime = now;

  try{
    const resp = await fetch(API_BASE + '/api/sync/push', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ deviceId, data })
    });
    const result = await resp.json();
    if(result.success){
      // 静默成功，不打扰用户
      _updateSyncIndicator(true, result.updatedAt);
      localStorage.setItem(STORAGE_KEY + '_lastPush', Date.now());
    } else {
      console.warn('☁️ 推送失败:', result.error);
    }
  }catch(e){
    // 静默失败（不影响本地操作）
    console.warn('☁️ 云端推送异常:', e.message);
  }
}

// ============================================================

function todayStr(){ return new Date().toISOString().slice(0,10); }
function dateStr(d){ return d.toISOString().slice(0,10); }
function weekKey(d){
  const date = d||new Date();
  const onejan = new Date(date.getFullYear(),0,1);
  const week = Math.ceil(((date-onejan)/86400000 + onejan.getDay()+1)/7);
  return date.getFullYear()+'-W'+week;
}
function monthKey(d){ const date=d||new Date(); return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0'); }
function last7Days(){
  const arr=[];const now=new Date();
  for(let i=6;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i); arr.push(dateStr(d)); }
  return arr;
}
function last30Days(){
  const arr=[];const now=new Date();
  for(let i=29;i>=0;i--){ const d=new Date(now); d.setDate(d.getDate()-i); arr.push(dateStr(d)); }
  return arr;
}
function fmtTime(min){
  min = Math.round(min||0);
  const h=Math.floor(min/60), m=min%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function fmtDateCN(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const days=['日','一','二','三','四','五','六'];
  return (d.getMonth()+1)+'月'+d.getDate()+'日 星期'+days[d.getDay()];
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function getWeekday(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  return ['日','一','二','三','四','五','六'][d.getDay()];
}

function getDayModuleDuration(date, moduleKey){
  let total = 0;
  if(DB.manualDuration[date] && DB.manualDuration[date][moduleKey]){
    total += DB.manualDuration[date][moduleKey];
  }
  (DB.tasks[moduleKey]||[]).forEach(t=>{
    if(t.date===date && t.isDone && t.actualMin){
      total += parseInt(t.actualMin)||0;
    }
  });
  (DB.records[moduleKey]||[]).forEach(r=>{
    if(r.date===date && r.durationMin){
      total += parseInt(r.durationMin)||0;
    }
  });
  return total;
}
function getDayTotalDuration(date){
  let total=0;
  MODULES.forEach(m=>{ total+=getDayModuleDuration(date,m.key); });
  return total;
}
function getWeekModuleDuration(moduleKey){
  const days=last7Days();let total=0;
  days.forEach(d=>{ total+=getDayModuleDuration(d,moduleKey); });
  return total;
}
function getTotalModuleDuration(moduleKey){
  let total=0;
  Object.keys(DB.manualDuration||{}).forEach(date=>{
    if(DB.manualDuration[date][moduleKey]) total+=DB.manualDuration[date][moduleKey];
  });
  (DB.tasks[moduleKey]||[]).forEach(t=>{
    if(t.isDone && t.actualMin) total+=parseInt(t.actualMin)||0;
  });
  (DB.records[moduleKey]||[]).forEach(r=>{
    if(r.durationMin) total+=parseInt(r.durationMin)||0;
  });
  return total;
}
function getGrandTotalDuration(){
  let total=0;
  MODULES.forEach(m=>{ total+=getTotalModuleDuration(m.key); });
  return total;
}

function getTodayTaskCount(){
  let total=0,done=0;
  const today=todayStr();
  MODULES.forEach(m=>{
    (DB.tasks[m.key]||[]).forEach(t=>{
      if(t.date===today){ total++; if(t.isDone) done++; }
    });
  });
  return {total,done};
}

function getTodayQuote(){
  let idx = DB.quotes.currentIndex||0;
  const today = todayStr();
  if(DB.quotes.lastUpdate!==today){
    const dayNum = Math.floor(Date.now()/(86400000));
    idx = dayNum % QUOTES.length;
    DB.quotes.currentIndex = idx;
    DB.quotes.lastUpdate = today;
    saveDB();
  }
  return QUOTES[idx];
}

// ============================================================
//  总任务进度（用于统计 + 模块页头）
// ============================================================
// 总任务 = 每个任务的「总目标量」的总和。子任务 = 当前已完成量。
// 兼容两种模式：
//   A. 任务有 "taskTotal"（总量，例如 1000 题）+ "taskDone"（已完成）
//   B. 任务有 "targetMin"（时长目标）
function getModuleTotals(moduleKey){
  const list = DB.tasks[moduleKey]||[];
  let total = 0, done = 0;
  list.forEach(t=>{
    if(t.taskTotal){
      total += parseInt(t.taskTotal)||0;
      done  += parseInt(t.taskDone)||0;
    }
  });
  // 也兼容：从每日 record 累计（按 total/correct 累加到当前未完成任务）
  return {total, done};
}
function getGrandTaskTotals(){
  let total=0,done=0;
  MODULES.forEach(m=>{
    const r=getModuleTotals(m.key);
    total+=r.total; done+=r.done;
  });
  return {total, done};
}

// ============================================================
//  方块进度（参考图片：12 个小方块可视化）
// ============================================================
/**
 * 渲染 12 格方块进度
 * @param {number} done 已完成数量
 * @param {number} total 总量
 * @param {string} unit 单位（如 "题"、"套"），可选
 * @param {number} blockCount 方块数（默认 12）
 */
function renderBlockProgress(done, total, unit='', blockCount=12){
  if(!total || total<=0) return '';
  done = Math.min(done||0, total);
  const perBlock = total / blockCount;
  let html = '<div class="prog-block-row">';
  html += '<span class="prog-block-label">进度：</span>';
  for(let i=1; i<=blockCount; i++){
    const blockStart = (i-1) * perBlock;
    const blockEnd = i * perBlock;
    let pct = 0;
    let cls = 'empty';
    if(done >= blockEnd){
      pct = 100;
      cls = 'full';
    } else if(done > blockStart){
      pct = ((done - blockStart) / perBlock) * 100;
      cls = 'partial';
    }
    html += `<div class="prog-block ${cls}"><div class="prog-block-fill" style="width:${pct.toFixed(1)}%"></div></div>`;
  }
  if(unit) html += `<span class="prog-block-unit">${unit}</span>`;
  html += '</div>';
  return html;
}

// 单模块任务总量进程可视化（方块进度 + 总数）
function renderModuleBlockChartHTML(moduleKey, m){
  const tasks = DB.tasks[moduleKey]||[];
  let total = 0, done = 0, hasSub = false;
  const subtaskItems = [];
  tasks.forEach(t=>{
    if(t.taskTotal){
      total += parseInt(t.taskTotal)||0;
      done  += parseInt(t.taskDone)||0;
      hasSub = true;
      // 收集子任务进度
      if(t.subtasks && t.subtasks.length>0){
        const subDone = t.subtasks.filter(s=>s.done).length;
        subtaskItems.push({
          title: t.title,
          total: t.taskTotal,
          done: t.taskDone||0,
          subtasks: t.subtasks,
          subtaskDone: subDone,
          subtaskTotal: t.subtasks.length
        });
      }
    }
  });
  if(total === 0) return '';
  const pct = Math.round(done/total*100);
  let html = `
    <div class="grand-progress-card">
      <div class="gpc-title">
        <span>🎯 ${m.icon} ${m.name} - 任务总量进程</span>
        <span class="gpc-val">${done} / ${total}（${pct}%）</span>
      </div>
      <div class="gpc-summary">每块 ≈ ${Math.ceil(total/12)} ${t.unit||'题'}，绿色为已完成</div>
      ${renderBlockProgress(done, total, t.unit||'题')}
  `;
  // 子任务展开
  if(subtaskItems.length > 0){
    html += '<div style="margin-top:10px;border-top:1px dashed #eee;padding-top:8px;">';
    subtaskItems.forEach(item=>{
      html += `
        <div style="font-size:12px;margin-bottom:6px;color:var(--text-sec);">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
            <span>📌 ${item.title}</span>
            <span style="color:var(--blue);font-weight:700;">子任务 ${item.subtaskDone}/${item.subtaskTotal}</span>
          </div>
          ${renderBlockProgress(item.done, item.total, '', 10)}
        </div>`;
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

// 总任务进程可视化（首页 + 统计页用）
function renderGrandTaskChartHTML(){
  const grand = getGrandTaskTotals();
  if(grand.total === 0){
    return `
      <div class="grand-progress-card">
        <div class="gpc-title">
          <span>🎯 总任务进程</span>
          <span class="gpc-val">尚未设置</span>
        </div>
        <div style="font-size:12px;color:var(--text-sec);padding:8px 0;">
          在每个模块的"添加任务"中设置「任务总量」+「每日完成量」即可看到方块进度
        </div>
      </div>
    `;
  }
  const pct = Math.round(grand.done/grand.total*100);
  const modulesWithTasks = [];
  MODULES.forEach(m=>{
    const r = getModuleTotals(m.key);
    if(r.total > 0){
      modulesWithTasks.push({...m, ...r});
    }
  });

  let html = `
    <div class="grand-progress-card">
      <div class="gpc-title">
        <span>🎯 总任务进程（所有模块）</span>
        <span class="gpc-val">${grand.done} / ${grand.total}（${pct}%）</span>
      </div>
      ${renderBlockProgress(grand.done, grand.total, '')}
  `;
  modulesWithTasks.forEach(m=>{
    const mPct = Math.round(m.done/m.total*100);
    html += `
      <div class="gpc-module">
        <div class="gpc-mod-name">
          <span class="gpc-mod-label">${m.icon} ${m.name}</span>
          <span class="gpc-mod-val">${m.done}/${m.total}（${mPct}%）</span>
        </div>
        ${renderBlockProgress(m.done, m.total, '', 12)}
      </div>`;
  });
  html += '</div>';
  return html;
}

function renderGrandProgressList(){
  // 显示每个模块的总任务进度（前 6 个有任务的）
  const rows = [];
  MODULES.forEach(m=>{
    const t=getModuleTotals(m.key);
    if(t.total>0){
      const pct=Math.round(t.done/t.total*100);
      rows.push({name:m.name, icon:m.icon, done:t.done, total:t.total, pct});
    }
  });
  if(rows.length===0) return '<div style="font-size:12px;color:var(--text-sec);text-align:center;padding:6px;">还没有设置任务总量，去添加吧 ↓</div>';
  rows.sort((a,b)=>b.pct-a.pct);
  let html='<div class="bpc-list">';
  rows.slice(0,6).forEach(r=>{
    html+=`
      <div class="bpc-row">
        <div class="bpc-name">${r.icon} ${r.name}</div>
        <div class="bpc-track"><div style="width:${r.pct}%;"></div></div>
        <div class="bpc-num">${r.done}/${r.total}</div>
      </div>`;
  });
  html+='</div>';
  return html;
}

function renderModulePage(key){
  const m=MODULES.find(x=>x.key===key);
  const today=todayStr();
  const todayDur=getDayModuleDuration(today,key);
  const weekDur=getWeekModuleDuration(key);
  const totalDur=getTotalModuleDuration(key);
  const tasks=DB.tasks[key]||[];
  const todayTasks=tasks.filter(t=>t.date===today&&!t.isDone);
  const doneTasks=tasks.filter(t=>t.date===today&&t.isDone);
  const records=DB.records[key]||[];
  // 按 timestamp 取"今日最后一次记录"作为表单预填
  const todayRecords = records.filter(r=>r.date===today).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  const todayRecord = todayRecords[0]||{date:today};

  let html=moduleHeaderHTML(m,todayDur);
  html+=statCardsHTML(key,todayDur,weekDur,totalDur);
  html+=bigTaskProgressHTML(key);
  html+=taskSectionHTML(key,m,todayTasks,doneTasks);
  html+=progressRecordHTML(key,m,todayRecord);
  html+=accuracyTrendHTML(key);
  html+=chartSectionHTML(key);
  document.getElementById('page-'+key).innerHTML=html;
}

function addTask(key){
  const title=document.getElementById('newTaskTitle').value.trim();
  if(!title){ showToast('请输入任务名称'); return; }
  const target=parseInt(document.getElementById('newTaskTarget').value)||0;
  const total=parseInt(document.getElementById('newTaskTotal').value)||0;
  const daily=parseInt(document.getElementById('newTaskDaily').value)||0;
  const repeat=document.getElementById('newTaskRepeat').value;
  const subs=document.getElementById('newTaskSubs').value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean);
  const subtasks = subs.map(s=>({title:s,done:false}));

  // 防止重复添加同标题任务
  const dup = (DB.tasks[key]||[]).find(t => t.title === title);
  if(dup){
    if(!confirm(`已存在同名任务「${title}」\n（${dup.targetMin||0}分钟/次，${dup.repeat==='none'?'不重复':dup.repeat}）\n\n确定还是要新增一个吗？`)) return;
  }

  DB.tasks[key].push({
    id:uid(),
    title:title,
    targetMin:target,
    actualMin:0,
    isDone:false,
    date:todayStr(),
    createdAt:Date.now(),
    repeat:repeat,
    taskTotal:total||0,
    taskDone:0,
    dailyTarget:daily||0,
    subtasks:subtasks
  });
  saveDB();
  closeBottomSheet();
  showToast('🎀 已添加~');
  renderModulePage(key);
}

function saveEditTask(key,taskId){
  const task=DB.tasks[key].find(t=>t.id===taskId);
  if(!task){ showToast('任务不存在'); return; }
  const title=document.getElementById('editTaskTitle').value.trim();
  if(!title){ showToast('请输入任务名称'); return; }

  task.title = title;
  task.targetMin = parseInt(document.getElementById('editTaskTarget').value)||0;
  task.taskTotal = parseInt(document.getElementById('editTaskTotal').value)||0;
  task.taskDone  = parseInt(document.getElementById('editTaskDone').value)||0;
  if(task.taskTotal && task.taskDone > task.taskTotal) task.taskDone = task.taskTotal;
  task.dailyTarget = parseInt(document.getElementById('editTaskDaily').value)||0;
  task.repeat = document.getElementById('editTaskRepeat').value;

  saveDB();
  closeBottomSheet();
  showToast('✏️ 已更新~');
  renderModulePage(key);
}

function toggleTask(key,taskId,e){
  const task=DB.tasks[key].find(t=>t.id===taskId);
  if(!task) return;
  task.isDone=!task.isDone;
  if(task.isDone && !task.actualMin && task.targetMin){
    task.actualMin=task.targetMin;
  }
  // 完成任务时，如果设了 dailyTarget，则 taskDone += dailyTarget
  if(task.isDone && task.dailyTarget){
    task.taskDone = (parseInt(task.taskDone)||0) + parseInt(task.dailyTarget);
    if(task.taskTotal && task.taskDone>=task.taskTotal){
      task.taskDone = task.taskTotal;
    }
  }
  saveDB();
  if(task.isDone){
    showToast('✅ 完成啦~');
    if(e){
      const rect=e.target.getBoundingClientRect();
      showHearts(rect.left+rect.width/2, rect.top);
    }
  }
  renderModulePage(key);
  if(document.querySelector('.nav-item.active')?.dataset.page==='home') renderHome();
}

function updateTaskField(key,taskId,field,val){
  const task=DB.tasks[key].find(t=>t.id===taskId);
  if(!task) return;
  task[field]=parseInt(val)||0;
  saveDB();
  if(field==='actualMin'&&task.isDone) renderModulePage(key);
}

function deleteTask(key,taskId){
  DB.tasks[key]=DB.tasks[key].filter(t=>t.id!==taskId);
  saveDB();
  showToast('已删除');
  renderModulePage(key);
}

// 结束重复
function endRepeat(key,taskId){
  const task=DB.tasks[key].find(t=>t.id===taskId);
  if(!task) return;
  if(!confirm(`确定结束"${task.title}"的重复规则吗？\n（不影响已生成的实例任务）`)) return;
  task.repeat='none';
  saveDB();
  showToast('🛑 已结束重复');
  renderModulePage(key);
}

// 子任务
function toggleSubtask(key,taskId,idx,e){
  const task=DB.tasks[key].find(t=>t.id===taskId);
  if(!task||!task.subtasks||!task.subtasks[idx]) return;
  task.subtasks[idx].done = !task.subtasks[idx].done;
  saveDB();
  if(e){ const rect=e.target.getBoundingClientRect(); showHearts(rect.left+rect.width/2, rect.top); }
  renderModulePage(key);
}
function deleteSubtask(key,taskId,idx){
  const task=DB.tasks[key].find(t=>t.id===taskId);
  if(!task||!task.subtasks) return;
  task.subtasks.splice(idx,1);
  saveDB();
  renderModulePage(key);
}

  let html=`

function renderRecordHistoryHTML(key){
  const list = (DB.records[key]||[]).filter(r=>r.total!=null || r.correct!=null || r.min!=null)
                    .slice().sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).slice(0,15);
  if(list.length===0) return '';
  let html = '<div class="card"><div style="font-size:13px;font-weight:700;color:var(--red);margin-bottom:8px;">📜 最近录入（按时序）</div>';
  list.forEach(r=>{
    const time = r.timestamp ? new Date(r.timestamp).toLocaleTimeString('zh-CN',{hour12:false}) : '';
    html+=`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f5f5f5;font-size:12px;">
        <span>📅 ${r.date} ${time}</span>
        <span style="display:flex;gap:8px;">
          ${r.total!=null?`<span style="color:var(--text-sec);">${r.correct||0}/${r.total}</span>`:''}
          ${r.accuracy!=null?`<span style="color:var(--red);font-weight:700;">${r.accuracy}%</span>`:''}
          ${r.min!=null?`<span style="color:var(--blue);">${r.min}分${r.sec||0}秒</span>`:''}
          <span onclick="deleteRecord('${key}','${r.id}')" style="cursor:pointer;">🗑️</span>
        </span>
      </div>`;
  });
  html += '</div>';

}
function deleteRecord(key,id){
  DB.records[key] = (DB.records[key]||[]).filter(r=>r.id!==id);
  saveDB();
  showToast('已删除');
  renderPage(key);
}

function calcAccuracy(key){
  const total=parseInt(document.getElementById(`rec-total-${key}`).value)||0;
  const correct=parseInt(document.getElementById(`rec-correct-${key}`).value)||0;
  const acc=total>0?Math.round(correct/total*100):0;
  document.getElementById(`acc-${key}`).textContent=`→ 正确率：${acc}%`;
}
function toggleChip(el,key,field,tag){
  el.classList.toggle('checked');
}
function setStars(key,n){
  const stars=document.querySelectorAll(`#diff-stars-${key} .star`);
  stars.forEach((s,i)=>s.classList.toggle('active',i<n));
}
function gentleSkip(key){
  const today=todayStr();
  let rec=DB.records[key].find(r=>r.date===today&&r.id===undefined);
  // 用最近的"今日记录"累加 skip
  const todayRecs = DB.records[key].filter(r=>r.date===today).sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
  let rec2 = todayRecs[0];
  if(!rec2){ rec2={id:uid(),date:today,timestamp:Date.now()}; DB.records[key].push(rec2); }
  rec2.skipCount=(rec2.skipCount||0)+1;
  saveDB();
  showToast('🎀 没关系，把精力留给其他模块~');
  renderModulePage(key);
}

function saveProgressRecord(key){
  const today=todayStr();
  // 关键：每次保存都"新增一条记录"，不做覆盖
  const rec = {id:uid(), date:today, timestamp:Date.now()};
  const totalEl=document.getElementById(`rec-total-${key}`);
  const correctEl=document.getElementById(`rec-correct-${key}`);
  if(totalEl) rec.total=parseInt(totalEl.value)||0;
  if(correctEl) rec.correct=parseInt(correctEl.value)||0;
  if(rec.total>0) rec.accuracy=Math.round(rec.correct/rec.total*100);

  const noteEl=document.getElementById(`rec-note-${key}`);
  if(noteEl) rec.note=noteEl.value;

  const skillEl=document.getElementById(`rec-skill-${key}`);
  if(skillEl) rec.skill=skillEl.value;

  const minEl=document.getElementById(`rec-min-${key}`);
  const secEl=document.getElementById(`rec-sec-${key}`);
  if(minEl){
    const min=parseInt(minEl.value)||0;
    const sec=parseInt(secEl.value)||0;
    rec.min=min; rec.sec=sec;
    if(rec.total>0){
      rec.durationMin=Math.round((min*60+sec)/60*10)/10;
      rec.avgPerQuestion=Math.round((min*60+sec)/rec.total*10)/10;
    }
  }

  const chips=document.querySelectorAll(`#page-${key} .checkbox-group .check-chip.checked`);
  if(chips.length>0){
    rec.weakTags=Array.from(chips).map(c=>c.textContent);
  }

  const activeStars=document.querySelectorAll(`#diff-stars-${key} .star.active`);
  if(activeStars.length>0) rec.difficulty=activeStars.length;

  DB.records[key].push(rec);
  saveDB();
  showToast('🎀 已保存~');
  renderModulePage(key);
}

function accuracyTrendHTML(key){
  // 取所有有效记录（按时间序）
  const list = (DB.records[key]||[]).filter(r=>r.accuracy!=null)
                    .slice().sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
  if(list.length===0) return '';
  const data = list.map(r=>{
    const time = r.timestamp ? new Date(r.timestamp) : new Date(r.date+'T12:00:00');
    const label = r.timestamp
      ? `${r.date.slice(5)} ${String(time.getHours()).padStart(2,'0')}:${String(time.getMinutes()).padStart(2,'0')}`
      : r.date.slice(5);
    return {label, value:r.accuracy, valLabel:r.accuracy+'%'};
  });
  const avg = Math.round(list.reduce((s,r)=>s+(r.accuracy||0),0)/list.length);
  return `
    <div class="chart-container">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div style="font-size:13px;color:var(--red);font-weight:700;">📈 正确率趋势（每次录入）</div>
        <div style="font-size:12px;color:var(--blue);font-weight:700;">平均 ${avg}%</div>
      </div>
      ${renderLineChart(data,'#E52211')}
    </div>
  `;
}

function chartSectionHTML(key){
  const days=last7Days();
  const data=days.map(d=>({date:d,dur:getDayModuleDuration(d,key)}));
  const maxDur=Math.max(...data.map(d=>d.dur),1);
  const totalH=(getTotalModuleDuration(key)/60).toFixed(1);

  let html='<div class="section-title"><span class="st-icon">📈</span>时间统计</div>';

  // 柱状图
  html+='<div class="chart-container">';
  html+='<div style="font-size:13px;color:var(--text-sec);">最近7天每日专注时长</div>';
  html+='<div class="bar-chart">';
  data.forEach(d=>{
    const h=(d.dur/maxDur)*100;
    html+=`<div class="bar-col"><div class="bar" style="height:${h}%;" title="${fmtTime(d.dur)}"></div><div class="bar-label">${getWeekday(d.date)}</div></div>`;
  });
  html+='</div>';
  html+=`<div style="text-align:center;font-size:13px;color:var(--blue);margin-top:10px;font-weight:700;">已累计专注 <strong>${totalH}</strong> 小时</div>`;
  html+='</div>';

  // 总任务进程可视化图表（参考图片样式：横向进度条列表）
  html += renderTaskTotalsChartHTML();

  // 本周各模块对比
  html+='<div class="chart-container">';
  html+='<div style="font-size:13px;color:var(--text-sec);margin-bottom:8px;font-weight:700;">本周各模块时长对比</div>';
  const weekData=MODULES.map(m=>({name:m.name,icon:m.icon,dur:getWeekModuleDuration(m.key)}));
  const maxWeek=Math.max(...weekData.map(d=>d.dur),1);
  weekData.sort((a,b)=>b.dur-a.dur);
  weekData.forEach(d=>{
    const w=(d.dur/maxWeek)*100;
    html+=`<div class="hbar-row"><div class="hbar-label">${d.icon} ${d.name}</div><div class="hbar-track"><div class="hbar-fill" style="width:${w}%;"></div></div><div class="hbar-val">${fmtTime(d.dur)}</div></div>`;
  });
  html+='</div>';

  html+=`<button class="save-btn blue" onclick="goPage('stats')">📊 查看全局统计</button>`;
  return html;
}

// 总任务进程可视化（每个模块任务总量进度 - 方块风格）
function renderTaskTotalsChartHTML(){
  const rows=[];
  MODULES.forEach(m=>{
    const t=getModuleTotals(m.key);
    if(t.total>0){
      rows.push({name:m.name, icon:m.icon, done:t.done, total:t.total,
        pct: Math.round(t.done/t.total*100), key:m.key});
    }
  });
  if(rows.length===0) return '';
  rows.sort((a,b)=>b.pct-a.pct);
  const grand = getGrandTaskTotals();
  let html = `
    <div class="chart-container">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-size:13px;color:var(--red);font-weight:800;">🎯 总任务进程（所有模块）</div>
        <div style="font-size:12px;color:var(--blue);font-weight:700;">${grand.done}/${grand.total}（${Math.round(grand.done/grand.total*100)}%）</div>
      </div>
      ${renderBlockProgress(grand.done, grand.total, '')}
      <div style="border-top:1px dashed #eee;margin-top:12px;padding-top:10px;">
        <div style="font-size:12px;color:var(--text-sec);font-weight:600;margin-bottom:6px;">各模块：</div>`;
  rows.forEach(r=>{
    html+=`
      <div style="margin-top:8px;">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">
          <span style="font-weight:700;color:var(--text);">${r.icon} ${r.name}</span>
          <span style="color:var(--blue);font-weight:700;">${r.done}/${r.total} · ${r.pct}%</span>
        </div>
        ${renderBlockProgress(r.done, r.total, '', 10)}
      </div>`;
  });
  html += '</div></div>';
  return html;
}

function openMaterialLib(from){
  let currentCat='全部';
  function renderList(cat,search){
    let list=DB.materials||[];
    if(from) list=list.filter(m=>m.from===from);
    if(cat&&cat!=='全部') list=list.filter(m=>m.cat===cat);
    if(search) list=list.filter(m=>m.content.includes(search)||m.source.includes(search));
    if(list.length===0) return '<div class="empty-state"><div class="es-icon">📚</div><div class="es-text">还没有素材哦~</div></div>';
    return list.slice().reverse().map(m=>`
      <div class="material-item">
        <div class="mi-content">${m.content}</div>
        <div class="mi-meta">📂 ${m.cat||'未分类'} · 📌 ${m.source||'未知来源'} · 📅 ${m.date}</div>
      </div>`).join('');
  }
  function update(html){
    document.getElementById('material-list-area').innerHTML=html;
  }
  let html=`
    <h3>📖 素材库</h3>
    <input type="text" class="search-box" id="mat-search" placeholder="🔍 搜索素材..." oninput="window._matSearch(this.value)">
    <div class="sub-tabs" id="mat-cats">
      <div class="sub-tab active" onclick="window._matCat('全部',this)">全部</div>
      ${MATERIAL_CATS.map(c=>`<div class="sub-tab" onclick="window._matCat('${c}',this)">${c}</div>`).join('')}
    </div>
    <div class="material-list" id="material-list-area">${renderList('全部','')}</div>
    <div class="bs-close" onclick="closeBottomSheet()">关闭</div>
  `;
  openBottomSheet(html);
  window._matSearch=function(val){
    const activeCat=document.querySelector('#mat-cats .sub-tab.active');
    update(renderList(activeCat?activeCat.textContent:'全部',val));
  };
  window._matCat=function(cat,el){
    document.querySelectorAll('#mat-cats .sub-tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    const search=document.getElementById('mat-search').value;
    update(renderList(cat,search));
  };
}

function renderMokaoSubAccuracyHTML(){
  // 统计 mokaoSubs 数据
  const subs = {};
  ['常识判断','言语理解','判断推理','资料分析','数量关系','概括归纳','综合分析','提出对策','贯彻执行','文章论述'].forEach(s=>{
    subs[s] = {total:0, correct:0};
  });
  Object.keys(DB.mokaoSubs||{}).forEach(date=>{
    const day = DB.mokaoSubs[date];
    if(day.xingce){
      Object.keys(day.xingce).forEach(k=>{
        if(subs[k]){ subs[k].total += parseInt(day.xingce[k].total)||0; subs[k].correct += parseInt(day.xingce[k].correct)||0; }
      });
    }
    if(day.shenlun){
      Object.keys(day.shenlun).forEach(k=>{
        if(subs[k]){ subs[k].total += parseInt(day.shenlun[k].total)||0; subs[k].correct += parseInt(day.shenlun[k].correct)||0; }
      });
    }
  });
  const list = Object.entries(subs).filter(([k,v])=>v.total>0);
  if(list.length===0) return '';
  let html = `
    <div class="section-title"><span class="st-icon">📊</span>各模块题量与正确数</div>
    <div class="card">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;">
  `;
  list.forEach(([k,v])=>{
    const acc = v.total>0 ? Math.round(v.correct/v.total*100) : 0;
    html+=`
      <div style="background:var(--bg);padding:8px;border-radius:8px;">
        <div style="font-weight:700;color:var(--red);">${k}</div>
        <div style="font-size:11px;color:var(--text-sec);">${v.correct}/${v.total} 题</div>
        <div style="font-size:14px;font-weight:800;color:var(--blue);">${acc}%</div>
      </div>`;
  });
  html += `</div></div>`;
  return html;
}

// 折线图渲染
function renderLineChart(data,color,targetLine,targetLabel){
  if(!data||data.length===0) return '<div style="text-align:center;color:var(--text-sec);padding:20px;">暂无数据</div>';
  const values=data.map(d=>d.value);
  const max=Math.max(...values, targetLine||0, 1);
  const min=Math.min(...values, 0);
  const range=max-min||1;
  const w=340,h=160,padL=36,padR=12,padT=14,padB=26;
  const cw=w-padL-padR, ch=h-padT-padB;
  const step=cw/Math.max(data.length-1,1);
  let points=data.map((d,i)=>{
    const x=padL+i*step;
    const y=padT+ch-((d.value-min)/range)*ch;
    return {x,y,d};
  });
  let pathD=points.map((p,i)=>(i===0?'M':'L')+p.x+','+p.y).join(' ');
  let html=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:160px;">`;
  // 目标线
  if(targetLine!=null){
    const ty=padT+ch-((targetLine-min)/range)*ch;
    html+=`<line x1="${padL}" y1="${ty}" x2="${w-padR}" y2="${ty}" stroke="#0085D0" stroke-width="1.5" stroke-dasharray="4,3"/>`;
    html+=`<text x="${w-padR}" y="${ty-3}" font-size="10" fill="#0085D0" text-anchor="end" font-weight="bold">${targetLabel||''}</text>`;
  }
  // Y 轴
  html+=`<text x="${padL-4}" y="${padT+8}" font-size="9" fill="#6B5C5F" text-anchor="end">${max}</text>`;
  html+=`<text x="${padL-4}" y="${padT+ch}" font-size="9" fill="#6B5C5F" text-anchor="end">${min}</text>`;
  // 折线
  html+=`<path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>`;
  // 数据点
  points.forEach(p=>{
    html+=`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#0085D0"/>`;
    // 旋转标签：超过 8 个时倾斜避免重叠
    const angle = data.length>8 ? -35 : 0;
    html+=`<text x="${p.x}" y="${h-6}" font-size="8" fill="#6B5C5F" text-anchor="end" transform="rotate(${angle} ${p.x} ${h-6})">${p.d.label}</text>`;
  });
  html+='</svg>';
  return html;
}

function renderCalendar(moduleKey){
  const now=new Date();
  const year=now.getFullYear(), month=now.getMonth();
  const firstDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const today=todayStr();
  let html='<div class="calendar">';
  ['日','一','二','三','四','五','六'].forEach(d=>{ html+=`<div class="cal-header">${d}</div>`; });
  for(let i=0;i<firstDay;i++){ html+='<div class="cal-day"></div>'; }
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let hasData=false;
    if(moduleKey==='yundong'){
      hasData=getDayModuleDuration(ds,'yundong')>0;
    }else if(moduleKey==='qingxu'){
      hasData=(DB.moods||[]).some(m=>m.date===ds);
    }
    const isToday=ds===today;
    html+=`<div class="cal-day ${hasData?'has-data':''} ${isToday?'today':''}">${d}</div>`;
  }
  html+='</div>';
  return html;
}

function generateWeekReport(){
  const days=last7Days();
  const moduleDurations=MODULES.map(m=>({name:m.name,icon:m.icon,dur:getWeekModuleDuration(m.key)}));
  moduleDurations.sort((a,b)=>b.dur-a.dur);
  let taskTotal=0,taskDone=0;
  MODULES.forEach(m=>{
    (DB.tasks[m.key]||[]).forEach(t=>{
      if(days.includes(t.date)){ taskTotal++; if(t.isDone) taskDone++; }
    });
  });
  const taskRate=taskTotal>0?Math.round(taskDone/taskTotal*100):0;
  const weekReviews=(DB.reviews||[]).filter(r=>days.includes(r.date));
  const bests=weekReviews.map(r=>r.best).filter(b=>b);
  const interferes=weekReviews.map(r=>r.interfere).filter(i=>i);
  const weights=(DB.weight||[]).filter(w=>days.includes(w.date)).sort((a,b)=>a.date.localeCompare(b.date));
  const wChange=weights.length>=2?(weights[weights.length-1].weight-weights[0].weight).toFixed(1):null;

  let report='═══ 🎀 Romola周复盘报告 ═══\n';
  report+=`📅 ${days[0]} ~ ${days[6]}\n\n`;
  report+='━━━ 📊 各模块专注时长排名 ━━━\n';
  moduleDurations.forEach((d,i)=>{
    report+=`${i+1}. ${d.icon} ${d.name}：${fmtTime(d.dur)}\n`;
  });
  report+='\n━━━ ✅ 习惯打卡率 ━━━\n';
  report+=`本周完成任务 ${taskDone}/${taskTotal}，打卡率 ${taskRate}%\n\n`;
  report+='━━━ ⭐ 最佳事 TOP3 ━━━\n';
  bests.slice(0,3).forEach((b,i)=>{ report+=`${i+1}. ${b}\n`; });
  if(bests.length===0) report+='暂无记录\n';
  report+='\n━━━ ⚠️ 最常干扰 ━━━\n';
  if(interferes.length>0){
    const freq={};
    interferes.forEach(i=>{ freq[i]=(freq[i]||0)+1; });
    const sorted=Object.entries(freq).sort((a,b)=>b[1]-a[1]);
    sorted.slice(0,3).forEach(([k,v])=>{ report+=`• ${k}（${v}次）\n`; });
  }else{ report+='暂无记录\n'; }
  report+='\n━━━ 💪 体重变化 ━━━\n';
  if(wChange!==null){
    report+=`本周体重变化：${wChange>0?'+':''}${wChange}kg\n`;
  }else{ report+='暂无体重记录\n'; }
  report+='\n━━━ 💬 给自己的一句话 ━━━\n';
  report+='我们终将上岸，阳光万里 🌟\n';

  const html=`
    <div class="report-box">
      <h4>📋 周复盘报告（可复制）</h4>
      <textarea id="report-text" readonly>${report}</textarea>
      <button class="save-btn" onclick="copyReport()">📋 复制报告</button>
    </div>
  `;
  document.getElementById('report-area').innerHTML=html;
  showToast('🎀 报告已生成~');
}

  const ta=document.getElementById('report-text');
  ta.select();
  document.execCommand('copy');
  showToast('📋 已复制到剪贴板');
}

  else if(_statsTab==='month'){ dates=last30Days(); }
  else{ dates=null; }

  const moduleDurations=MODULES.map(m=>{
    let dur=0;
    if(dates){
      dates.forEach(d=>{ dur+=getDayModuleDuration(d,m.key); });
    }else{
      dur=getTotalModuleDuration(m.key);
    }
    return {name:m.name,icon:m.icon,key:m.key,dur};
  });
  const totalDuration=moduleDurations.reduce((s,d)=>s+d.dur,0);
  const totalHours=(totalDuration/60).toFixed(1);
  let totalTasks=0,totalDone=0;
  MODULES.forEach(m=>{
    (DB.tasks[m.key]||[]).forEach(t=>{
      if(!dates||dates.includes(t.date)){
        totalTasks++;
        if(t.isDone) totalDone++;
      }
    });
  });
  const dayCount=dates?dates.length:Object.keys(DB.manualDuration||{}).length||1;
  const avgHours=dayCount>0?(totalDuration/dayCount/60).toFixed(1):'0';

  let streak=0;
  const todayDate=new Date();
  for(let i=0;i<365;i++){
    const d=new Date(todayDate);d.setDate(d.getDate()-i);
    const ds=dateStr(d);
    if(getDayTotalDuration(ds)>0){ streak++; }
    else if(i>0){ break; }
  }

  let html='<div class="stat-data-grid">';
  html+=`<div class="stat-data-card"><div class="sdc-val">${totalHours}h</div><div class="sdc-label">总专注时长</div></div>`;
  html+=`<div class="stat-data-card"><div class="sdc-val">${totalDone}</div><div class="sdc-label">完成任务数</div></div>`;
  html+=`<div class="stat-data-card"><div class="sdc-val">${avgHours}h</div><div class="sdc-label">日均专注</div></div>`;
  html+=`<div class="stat-data-card"><div class="sdc-val">${streak}</div><div class="sdc-label">连续记录天数</div></div>`;
  html+='</div>';

  // 总体任务进度可视化（与首页一致，使用方块风格）
  const grand = getGrandTaskTotals();
  if(grand.total>0){
    const pct = Math.round(grand.done/grand.total*100);
    html+=`
      <div class="grand-progress-card">
        <div class="gpc-title">
          <span>🎯 总任务进程</span>
          <span class="gpc-val">${grand.done}/${grand.total}（${pct}%）</span>
        </div>
        ${renderBlockProgress(grand.done, grand.total, '')}
        ${renderGrandProgressList()}
      </div>`;
  }

  // 各模块时长饼图
  html+='<div class="chart-container">';
  html+='<div style="font-size:13px;color:var(--red);font-weight:700;margin-bottom:10px;">📊 各模块时长饼图</div>';
  html+=renderPieChart(moduleDurations,totalDuration);
  html+='</div>';

  // 折线
  if(_statsTab!=='today'&&_statsTab!=='all'){
    const days=_statsTab==='week'?last7Days():last30Days();
    const lineData=days.map(d=>({label:d.slice(5),value:getDayTotalDuration(d)}));
    html+='<div class="chart-container">';
    html+=`<div style="font-size:13px;color:var(--red);font-weight:700;margin-bottom:10px;">📈 每日总时长趋势</div>`;
    html+=renderLineChart(lineData,'#E52211');
    html+='</div>';
  }

  // 时段分布
  html+='<div class="chart-container">';
  html+='<div style="font-size:13px;color:var(--red);font-weight:700;margin-bottom:10px;">⏰ 时段分布</div>';
  const periods={'早晨(6-9)':0,'上午(9-12)':0,'下午(14-18)':0,'晚上(19-24)':0};
  MODULES.forEach(m=>{
    (DB.tasks[m.key]||[]).forEach(t=>{
      if(!dates||dates.includes(t.date)){
        const ts=new Date(t.createdAt);
        const h=ts.getHours();
        const dur=parseInt(t.actualMin)||0;
        if(h>=6&&h<9) periods['早晨(6-9)']+=dur;
        else if(h>=9&&h<12) periods['上午(9-12)']+=dur;
        else if(h>=14&&h<18) periods['下午(14-18)']+=dur;
        else if(h>=19||h<1) periods['晚上(19-24)']+=dur;
      }
    });
  });
  const maxP=Math.max(...Object.values(periods),1);
  Object.entries(periods).forEach(([k,v])=>{
    const w=(v/maxP)*100;
    html+=`<div class="hbar-row"><div class="hbar-label">${k}</div><div class="hbar-track"><div class="hbar-fill" style="width:${w}%;"></div></div><div class="hbar-val">${fmtTime(v)}</div></div>`;
  });
  html+='</div>';

  // 冠军 / 待加强
  const sorted=[...moduleDurations].sort((a,b)=>b.dur-a.dur);
  const champion=sorted[0];
  const weak=sorted[sorted.length-1];
  if(champion&&champion.dur>0){
    html+=`<div class="champion-badge"><span style="font-size:24px;">👑</span><div><div style="font-size:13px;font-weight:700;">本周专注冠军</div><div style="font-size:12px;">${champion.icon} ${champion.name} - ${fmtTime(champion.dur)}</div></div></div>`;
  }
  if(weak&&weak.dur>=0&&sorted.length>1){
    html+=`<div class="weak-badge"><span style="font-size:24px;">💪</span><div><div style="font-size:13px;font-weight:700;color:var(--blue);">待加强模块</div><div style="font-size:12px;color:var(--text-sec);">${weak.icon} ${weak.name} - ${fmtTime(weak.dur)}</div></div></div>`;
  }

  // 最近 7 天柱状
  if(_statsTab==='today'||_statsTab==='week'){
    const days=last7Days();
    const data=days.map(d=>({date:d,dur:getDayTotalDuration(d)}));
    const maxDur=Math.max(...data.map(d=>d.dur),1);
    html+='<div class="chart-container">';
    html+='<div style="font-size:13px;color:var(--red);font-weight:700;margin-bottom:10px;">📊 最近7天每日总时长</div>';
    html+='<div class="bar-chart">';
    data.forEach(d=>{
      const h=(d.dur/maxDur)*100;
      html+=`<div class="bar-col"><div class="bar" style="height:${h}%;" title="${fmtTime(d.dur)}"></div><div class="bar-label">${getWeekday(d.date)}</div></div>`;
    });
    html+='</div></div>';
  }

  // 体重趋势（统计页里也加一个）
  if((DB.weight||[]).length>=2){
    const weightAll = (DB.weight||[]).slice().sort((a,b)=>(a.timestamp||(a.date+'T12:00:00'))-(b.timestamp||(b.date+'T12:00:00')));
    html+='<div class="chart-container">';
    html+='<div style="font-size:13px;color:var(--red);font-weight:700;margin-bottom:8px;">📉 体重趋势（按每次录入）</div>';
    const wData = weightAll.map(w=>{
      const ts = w.timestamp ? new Date(w.timestamp) : new Date(w.date+'T12:00:00');
      const label = w.timestamp
        ? `${w.date.slice(5)} ${String(ts.getHours()).padStart(2,'0')}:${String(ts.getMinutes()).padStart(2,'0')}`
        : w.date.slice(5);
      return {label, value:w.weight};
    });
    html += renderLineChart(wData,'#E52211',55,'目标55kg');
    html+='</div>';
  }

  content.innerHTML=html;
}

function renderPieChart(data,total){
  if(total===0) return '<div style="text-align:center;color:var(--text-sec);padding:20px;">暂无数据</div>';
  const colors=['#E52211','#0085D0','#FEE202','#FF6B9D','#4DB8E6','#FF9999','#66C4DA','#FFB3C1','#99D6EA','#FFCDD2','#B3E0F2'];
  let cumPct=0;
  let slices='';
  data.forEach((d,i)=>{
    if(d.dur===0) return;
    const pct=d.dur/total;
    const startAngle=cumPct*360;
    const endAngle=(cumPct+pct)*360;
    slices+=renderPieSlice(60,60,50,startAngle,endAngle,colors[i%colors.length]);
    cumPct+=pct;
  });
  let html=`<div class="pie-chart-wrap"><svg width="120" height="120" viewBox="0 0 120 120">${slices}<circle cx="60" cy="60" r="22" fill="#FFFCFC"/><text x="60" y="58" text-anchor="middle" font-size="9" fill="#6B5C5F">总时长</text><text x="60" y="70" text-anchor="middle" font-size="11" font-weight="bold" fill="#E52211">${fmtTime(total)}</text></svg>`;
  html+='<div class="pie-legend">';
  data.forEach((d,i)=>{
    if(d.dur===0) return;
    html+=`<div class="pie-legend-item"><div class="pie-legend-dot" style="background:${colors[i%colors.length]};"></div>${d.icon} ${d.name} <span style="color:var(--text-sec);">${fmtTime(d.dur)}</span></div>`;
  });
  html+='</div></div>';
  return html;
}
function renderPieSlice(cx,cy,r,startAngle,endAngle,color){
  if(endAngle-startAngle>=359.99){
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>`;
  }
  const startRad=(startAngle-90)*Math.PI/180;
  const endRad=(endAngle-90)*Math.PI/180;
  const x1=cx+r*Math.cos(startRad);
  const y1=cy+r*Math.sin(startRad);
  const x2=cx+r*Math.cos(endRad);
  const y2=cy+r*Math.sin(endRad);
  const largeArc=endAngle-startAngle>180?1:0;
  return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2} Z" fill="${color}"/>`;
}

      1️⃣ 在<strong>每台设备</strong>输入相同的设备码<br>
      2️⃣ 点 <strong>拉取</strong>：合并云端数据到当前设备<br>
      3️⃣ 之后每次保存都会<strong>自动同步</strong>，无需手动操作<br>
      <br>
      📌 如需手动操作：
    </div>
    <div class="input-group">
      <label>设备码（自定义英文+数字，多设备用同一个）</label>
      <input type="text" id="syncIdInput" value="${curId}" placeholder="例如：romola-2026">
    </div>
    <button class="save-btn" onclick="pushCloud()">📤 推送当前数据到云端</button>
    <button class="save-btn blue" style="margin-top:8px;" onclick="pullCloud()">📥 拉取云端最新数据</button>
    <button class="save-btn ghost" style="margin-top:8px;" onclick="unbindCloud()">🚪 解绑设备码</button>
    ${statusEl}
    <div class="bs-close" onclick="closeBottomSheet()">关闭</div>
  `;
  openBottomSheet(html);
  // 异步检查云端状态
  if(curId && API_BASE) checkCloudStatus(curId);
}

async function checkCloudStatus(deviceId){
  try{
    const resp = await fetch(API_BASE + '/api/sync/pull?deviceId=' + encodeURIComponent(deviceId));
    const result = await resp.json();
    if(result.success){
      const updated = new Date(result.updatedAt).toLocaleString('zh-CN');
      document.getElementById('syncStatus').innerHTML =
        `<span style="color:var(--blue);">✅ 云端数据：${updated}（${result.sizeKB}KB）</span>`;
    } else if(result.exists === false){
      document.getElementById('syncStatus').innerHTML = '💡 设备码已就绪，等待首次推送';
    }
  }catch(e){
    document.getElementById('syncStatus').innerHTML = '⚠️ 无法连接云端服务';
  }
}

async function pushCloud(){
  const id = document.getElementById('syncIdInput').value.trim();
  if(!id){ showToast('请输入设备码'); return; }
  localStorage.setItem(SYNC_KEY, id);

  if(!API_BASE){
    showToast('⚠️ 未连接后端服务');
    return;
  }

  const statusEl = document.getElementById('syncStatus');
  statusEl.innerHTML = '⏳ 正在推送...';

  try{
    const resp = await fetch(API_BASE + '/api/sync/push', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ deviceId: id, data: DB })
    });
    const result = await resp.json();
    if(result.success){
      const time = new Date(result.updatedAt).toLocaleString('zh-CN');
      localStorage.setItem(STORAGE_KEY + '_lastPush', new Date(result.updatedAt).getTime());
      statusEl.innerHTML = `✅ 已推送到云端（${time}，${result.sizeKB}KB）`;
      showToast('☁️ 推送成功~');
    } else {
      statusEl.innerHTML = '⚠️ ' + (result.error || '推送失败');
      showToast('推送失败');
    }
  }catch(e){
    statusEl.innerHTML = '⚠️ 无法连接云端：' + e.message;
    showToast('连接失败');
  }
}

async function pullCloud(){
  const id = document.getElementById('syncIdInput').value.trim();
  if(!id){ showToast('请输入设备码'); return; }

  if(!API_BASE){
    showToast('⚠️ 未连接后端服务');
    return;
  }

  if(!confirm('确定拉取云端数据并合并到本地吗？\n（逐条比对，不覆盖本地独有的数据）')) return;

  const statusEl = document.getElementById('syncStatus');
  statusEl.innerHTML = '⏳ 正在拉取...';

  try{
    const resp = await fetch(API_BASE + '/api/sync/pull?deviceId=' + encodeURIComponent(id));
    if(resp.status === 404){
      statusEl.innerHTML = '⚠️ 云端暂无数据，请先在其他设备上推送';
      showToast('暂无云端数据');
      return;
    }
    const result = await resp.json();
    if(result.success){
      const updated = new Date(result.updatedAt).toLocaleString('zh-CN');
      const cloudTime = new Date(result.updatedAt).getTime();
      DB = mergeDB(DB, result.data);
      localStorage.setItem(SYNC_KEY, id);
      // 标记本地已同步到云端时间，避免 autoPull 反复合并
      localStorage.setItem(STORAGE_KEY + '_lastPush', cloudTime);
      saveDB();
      statusEl.innerHTML = `✅ 已拉取（${updated}，${result.sizeKB}KB）`;
      showToast('☁️ 已拉取~');
      goPage('home');
    } else {
      statusEl.innerHTML = '⚠️ ' + (result.error || '拉取失败');
    }
  }catch(e){
    statusEl.innerHTML = '⚠️ 无法连接云端：' + e.message;
    showToast('连接失败');
  }
}

function unbindCloud(){
  localStorage.removeItem(SYNC_KEY);
  showToast('已解绑设备码');
  openCloudSync();
}

// ============================================================
//  数据合并策略（云端优先 + 去重追加）
//  以远端为 base，将本地独有的记录追加进去
// ============================================================
function mergeDB(local, remote){
  if(!remote) return local;
  const merged = JSON.parse(JSON.stringify(remote));

  // 基础数组字段合并（使用更精确的 key）
  const arrays = ['moods','reviews','diet','mokao','weight','materials'];
  arrays.forEach(k=>{
    if(!merged[k]) merged[k]=[];
    const map = new Map();
    // 用 id 或 "date|timestamp" 作为 key，避免同天不同记录被误判为重复
    merged[k].forEach(x => {
      const key = x.id || `${x.date}|${x.timestamp||(x.id?x.id:'')}`;
      map.set(key, true);
    });
    (local[k]||[]).forEach(x => {
      const key = x.id || `${x.date}|${x.timestamp||(x.id?x.id:'')}`;
      if(!map.has(key)) merged[k].push(x);
    });
  });

  // tasks / records 按模块合并
  ['tasks','records'].forEach(group=>{
    if(!merged[group]) merged[group]={};
    Object.keys(local[group]||{}).forEach(modKey=>{
      if(!merged[group][modKey]) merged[group][modKey]=[];
      const map = new Map();
      // 精确 key：优先用 id
      merged[group][modKey].forEach(x => {
        const key = x.id;
        if(key) map.set(key, true);
      });
      (local[group][modKey]||[]).forEach(x => {
        const key = x.id;
        if(key && !map.has(key)){
          merged[group][modKey].push(x);
          map.set(key, true);
        } else if(!key){
          // 无 id 的旧数据用 date+timestamp+subType 兜底
          const fkey = `${x.date}|${x.timestamp||''}|${x.subType||''}`;
          if(!map.has(fkey)){
            merged[group][modKey].push(x);
            map.set(fkey, true);
          }
        }
      });
    });
  });

  // mokaoSubs 合并
  if(merged.mokaoSubs && local.mokaoSubs){
    Object.keys(local.mokaoSubs).forEach(date=>{
      if(!merged.mokaoSubs[date]) merged.mokaoSubs[date] = local.mokaoSubs[date];
    });
  }

  // ===== 任务模糊去重（关键）=====
  // 同一模块下：同 title 视为重复，只保留最新一条
  // （因为用户的「模板任务」创建时就带 date，无法靠 date/originalId 区分；
  //  同标题基本就是同一个任务的重复定义，合并为 1 个最安全）
  if(merged.tasks){
    Object.keys(merged.tasks).forEach(modKey=>{
      const arr = merged.tasks[modKey];
      if(!arr || arr.length<2) return;
      const seen = new Map();
      const kept = [];
      const sorted = arr.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      sorted.forEach(t=>{
        const sig = t.title||''; // 仅按标题去重
        if(!seen.has(sig)){
          seen.set(sig, true);
          kept.push(t);
        }
      });
      merged.tasks[modKey] = kept;
    });
  }

  // 基础数组模糊去重（同 date + 同核心数值视为重复）
  arrays.forEach(k=>{
    if(!merged[k] || merged[k].length < 2) return;
    const seen = new Map();
    merged[k] = merged[k].filter(x => {
      if(x.id) return true; // 有 id 的一律保留
      const sig = x.date;
      if(!sig) return true;
      if(seen.has(sig)){
        const prev = seen.get(sig);
        if(JSON.stringify(x) === JSON.stringify(prev)) return false;
        return true;
      }
      seen.set(sig, x);
      return true;
    });
  });

  // services 配置等
  ['examDate','settings','quotes'].forEach(k=>{
    if(local[k] && !merged[k]) merged[k] = local[k];
  });

  return merged;
}

// 云端同步状态指示器（在设置页显示）
let _syncIndicatorTimer = null;

  const dots = document.querySelectorAll('.cloud-fab');

function exportData(){
  const data=JSON.stringify(DB,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`romola-workspace-${todayStr()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('🎀 已导出~');
}
function importData(input){
  const file=input.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!data.version){ showToast('⚠️ 文件格式不正确'); return; }
      if(confirm('确定导入吗？将覆盖当前所有数据。')){
        DB=data;
        const def=defaultDB();
        for(const k in def){ if(DB[k]===undefined) DB[k]=def[k]; }
        MODULES.forEach(m=>{
          if(!DB.tasks[m.key]) DB.tasks[m.key]=[];
          if(!DB.records[m.key]) DB.records[m.key]=[];
        });
        saveDB();
        showToast('🎀 已导入~');
        goPage('home');
      }
    }catch(err){
      showToast('⚠️ 导入失败：'+err.message);
    }
  };
  reader.readAsText(file);
  input.value='';
}
function clearAllData(){
  if(confirm('确定清空所有数据吗？此操作不可恢复！')){
    DB=defaultDB();
    saveDB();
    showToast('已清空');
    goPage('home');
  }
}

// ============================================================
//  静默去重（init 时自动调用，不弹提示）
// ============================================================
function _silentDedupTasks(){
  let removed = 0;
  Object.keys(DB.tasks||{}).forEach(modKey=>{
    const arr = DB.tasks[modKey]||[];
    if(arr.length < 2) return;
    const seen = new Map();
    const kept = [];
    const sorted = arr.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    sorted.forEach(t=>{
      const sig = t.title||'';
      if(!seen.has(sig)){ seen.set(sig, true); kept.push(t); }
      else removed++;
    });
    DB.tasks[modKey] = kept;
  });
  if(removed > 0){
    console.log(`🧹 启动去重：清理了 ${removed} 条重复任务`);
    saveDB();
  }
}

// ============================================================
//  一键去重
// ============================================================
function dedupAllData(){
  let removed = 0;
  // 基础数组：用 id 或 date|timestamp 去重
  const dedupArray = (arr) => {
    if(!arr || arr.length < 2) return arr;
    const seen = new Map();
    return arr.filter(x => {
      const key = x.id || `${x.date}|${x.timestamp||JSON.stringify(x)}`;
      if(seen.has(key)){ removed++; return false; }
      seen.set(key, true);
      return true;
    });
  };

  // moods / reviews / diet / mokao / weight / materials
  ['moods','reviews','diet','mokao','weight','materials'].forEach(k=>{
    DB[k] = dedupArray(DB[k]||[]);
  });

  // records 逐模块去重（用 id）
  Object.keys(DB.records||{}).forEach(modKey=>{
    DB.records[modKey] = dedupArray(DB.records[modKey]||[]);
  });

  // tasks 逐模块去重：同 title 视为重复，保留最新一条
  Object.keys(DB.tasks||{}).forEach(modKey=>{
    const arr = DB.tasks[modKey]||[];
    if(arr.length < 2) return;
    const seen = new Map();
    const kept = [];
    const sorted = arr.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    sorted.forEach(t=>{
      const sig = t.title||'';
      if(!seen.has(sig)){ seen.set(sig, true); kept.push(t); }
      else removed++;
    });
    DB.tasks[modKey] = kept;
  });

  saveDB();
  if(removed > 0){
    showToast(`🔍 已清理 ${removed} 条重复记录`);
  } else {
    showToast('✅ 没有发现重复数据');
  }
  const active=document.querySelector('.nav-item.active');
  if(active) renderPage(active.dataset.page);
}

// ============================================================
//  自动生成重复任务
// ============================================================
function generateRecurringTasks(){
  const today=todayStr();
  const dayOfWeek=new Date().getDay(); // 0=Sun...
  let created=false;
  MODULES.forEach(m=>{
    const list = DB.tasks[m.key]||[];
    // 收集今天已存在的任务签名（按 title 去重，确保同标题只生成一次）
    const todayTitles = new Set();
    list.forEach(x=>{
      if(x.date===today){
        todayTitles.add(x.title);
      }
    });
    // 仅对「模板」生成：无 originalId（原始任务）且有 repeat
    // 用 title 做幂等键，同标题的多个模板只生成一次
    const generatedTitles = new Set();
    list.forEach(t=>{
      if(!t.repeat||t.repeat==='none') return;
      // 已生成的实例（有 originalId 且不等于自身 id）跳过
      if(t.originalId && t.originalId!==t.id) return;
      // 今天是否已存在同标题任务（任何来源）
      if(todayTitles.has(t.title)) return;
      // 本次 init 是否已为该标题生成过
      if(generatedTitles.has(t.title)) return;
      let shouldCreate=false;
      if(t.repeat==='daily') shouldCreate=true;
      else if(t.repeat==='weekday') shouldCreate=(dayOfWeek>=1&&dayOfWeek<=5);
      else if(t.repeat==='weekly') shouldCreate=(dayOfWeek===1);
      else if(t.repeat==='monthly') shouldCreate=(new Date().getDate()===1);
      if(shouldCreate){
        list.push({
          id:uid(),title:t.title,targetMin:t.targetMin,actualMin:0,isDone:false,
          date:today,createdAt:Date.now(),repeat:t.repeat,originalId:t.id,
          taskTotal:t.taskTotal||0, taskDone:t.taskDone||0, dailyTarget:t.dailyTarget||0,
          subtasks: t.subtasks? t.subtasks.map(s=>({title:s.title,done:false})) : []
        });
        generatedTitles.add(t.title);
        todayTitles.add(t.title);
        created=true;
      }
    });
    DB.tasks[m.key]=list;
  });
  if(created) saveDB();
}

// ============================================================
//  初始化
// ============================================================
function init(){
  loadDB();
  // 先去重（清理历史遗留的重复模板任务），再生成今日重复实例
  _silentDedupTasks();
  generateRecurringTasks();
  document.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click',()=>goPage(item.dataset.page));
  });
  renderHome();

  // 首次加载时尝试从云端拉取（静默合并）
  const syncId = localStorage.getItem(SYNC_KEY);
  if(syncId && API_BASE){
    setTimeout(() => autoPullOnInit(syncId), 1000);
  }

  setInterval(()=>{
    if(document.querySelector('.nav-item.active')?.dataset.page==='home'){
      const now=new Date();
      const hh=String(now.getHours()).padStart(2,'0');
      const mm=String(now.getMinutes()).padStart(2,'0');
      const timeEl=document.querySelector('.home-time');
      if(timeEl) timeEl.textContent=`${hh}:${mm}`;
    }
  },60000);

  // 每 5 分钟自动检查云端更新（后台静默拉取）
  if(API_BASE){
    setInterval(() => {
      const sid = localStorage.getItem(SYNC_KEY);
      if(sid) autoPullOnInit(sid);
    }, 5 * 60 * 1000);
  }
}

async function autoPullOnInit(deviceId){
  _isPulling = true;
  try{
    const resp = await fetch(API_BASE + '/api/sync/pull?deviceId=' + encodeURIComponent(deviceId));
    if(resp.status !== 200) return;
    const result = await resp.json();
    if(!result.success) return;
    // 比较云端更新时间是否比本地新
    const localTime = parseInt(localStorage.getItem(STORAGE_KEY + '_lastPush') || '0', 10);
    const cloudTime = new Date(result.updatedAt).getTime();
    if(cloudTime > localTime){
      const merged = mergeDB(DB, result.data);
      DB = merged;
      // 合并后立即静默去重（_isPulling=true，不会触发回推）
      _silentDedupTasks();
      // 直接写 localStorage，不触发 cloudPushAsync（_isPulling 仍为 true）
      localStorage.setItem(STORAGE_KEY, JSON.stringify(DB));
      // 更新本地推送时间为云端时间，避免下次又判定为「云端更新」反复合并
      localStorage.setItem(STORAGE_KEY + '_lastPush', cloudTime);
      console.log('☁️ 自动合并云端数据完成（已去重）');
      // 如果当前正在首页，刷新
      if(document.querySelector('.nav-item.active')?.dataset.page==='home'){
        renderHome();
      }
      _updateSyncIndicator(true, result.updatedAt);
    }
  }catch(e){
    // 静默失败
    console.log('☁️ 自动拉取不可用:', e.message);
  }finally{
    // 延迟释放标志，确保 saveDB 触发的 cloudPushAsync 也被跳过
    setTimeout(()=>{ _isPulling = false; }, 2000);
  }
}
init();
</script>
